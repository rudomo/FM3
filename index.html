<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front Mission 3 — Battle Skills Database (Offline)</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & TACTICAL NETWORK TERMINAL THEME (100% OFFLINE CSS)
       ========================================================================== */
    :root {
      --bg-base: #0b0f14;
      --bg-panel: #121821;
      --bg-panel-alt: #18202c;
      --bg-input: #0e131a;
      --bg-hover: #1e2836;
      --border-subtle: #253040;
      --border-strong: #384961;
      --text-primary: #e6edf5;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-amber: #f59e0b;
      --accent-amber-dim: rgba(245, 158, 11, 0.14);
      --accent-cyan: #38bdf8;
      --accent-cyan-dim: rgba(56, 189, 248, 0.14);
      --accent-emerald: #10b981;
      --accent-emerald-dim: rgba(16, 185, 129, 0.14);
      --accent-rose: #f43f5e;
      --accent-rose-dim: rgba(244, 63, 94, 0.14);
      --accent-violet: #a855f7;
      --accent-violet-dim: rgba(168, 85, 247, 0.14);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-panel: 0 10px 30px rgba(0, 0, 0, 0.45);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 1520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ==========================================================================
       2. HEADER & TACTICAL STATUS BAR
       ========================================================================== */
    .hud-header {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent-amber);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      box-shadow: var(--shadow-panel);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .hud-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    /* ==========================================================================
       3. CONTROLS & FILTER TOOLBAR
       ========================================================================== */
    .controls-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      box-shadow: var(--shadow-panel);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .controls-header-title {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .active-filter-badge {
      background: var(--accent-cyan-dim);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-cyan);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      display: none;
    }

    .active-filter-badge.visible {
      display: inline-block;
    }

    .controls-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .controls-panel.collapsed .controls-body {
      display: none;
    }

    .controls-top {
      display: grid;
      grid-template-columns: 1.8fr 1fr 0.9fr 1.2fr 0.9fr auto;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 1200px) {
      .controls-top {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .controls-top {
        grid-template-columns: 1fr;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    .input-field,
    .select-field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      padding: 9px 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-field:focus,
    .select-field:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .input-field::placeholder {
      color: var(--text-muted);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 9px 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn-amber {
      border-color: rgba(245, 158, 11, 0.5);
      color: var(--accent-amber);
      background: var(--accent-amber-dim);
    }

    .btn-amber:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--accent-amber);
      color: #fcd34d;
    }

    /* Quick Filter Rows */
    .quick-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .quick-pills-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .pill-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-right: 4px;
      letter-spacing: 0.05em;
    }

    .pill {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 4px 11px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .pill.active {
      background: var(--accent-cyan-dim);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .pill.slot-pill.active {
      background: var(--accent-amber-dim);
      border-color: var(--accent-amber);
      color: var(--accent-amber);
    }

    /* ==========================================================================
       4. DATATABLE CONTAINER & COLUMN HEADERS
       ========================================================================== */
    .table-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-panel);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.86rem;
    }

    thead {
      background: var(--bg-panel-alt);
      border-bottom: 2px solid var(--border-strong);
    }

    th {
      padding: 12px 12px;
      font-family: var(--font-mono);
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      user-select: none;
      vertical-align: top;
    }

    .th-sort {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      padding-bottom: 8px;
      white-space: nowrap;
    }

    .th-sort:hover {
      color: var(--accent-cyan);
    }

    .sort-indicator {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    th.sorted-asc .sort-indicator,
    th.sorted-desc .sort-indicator {
      color: var(--accent-amber);
    }

    .col-filter-input {
      width: 100%;
      min-width: 75px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.77rem;
      padding: 5px 8px;
      font-weight: 400;
    }

    .col-filter-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    tbody tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color 0.12s ease;
    }

    tbody tr.data-row:nth-of-type(4n + 3) {
      background-color: rgba(255, 255, 255, 0.012);
    }

    tbody tr.data-row:hover {
      background-color: var(--bg-hover);
    }

    td {
      padding: 11px 12px;
      vertical-align: top;
      color: var(--text-primary);
    }

    .skill-cell-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mobile-chevron {
      display: none;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.15s ease, color 0.15s ease;
    }

    tr.data-row.expanded .mobile-chevron {
      transform: rotate(180deg);
      color: var(--accent-amber);
    }

    .detail-row {
      display: none;
      background-color: var(--bg-input);
    }

    .detail-card {
      padding: 12px 14px;
      border-left: 3px solid var(--accent-amber);
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      font-size: 0.84rem;
    }

    .detail-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .detail-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .detail-value {
      color: var(--text-primary);
    }

    .detail-value ul {
      margin: 0;
      padding-left: 16px;
    }

    /* ==========================================================================
       INLINE EDIT MODE & FORM STYLES
       ========================================================================== */
    .mode-toggle-group {
      display: inline-flex;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--accent-cyan-dim);
      color: var(--accent-cyan);
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.45);
    }

    .mode-btn.active.edit-active {
      background: var(--accent-amber-dim);
      color: var(--accent-amber);
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.45);
    }

    body.edit-mode-enabled .skill-name-trigger {
      cursor: pointer;
      color: var(--accent-amber);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }

    body.edit-mode-enabled .skill-name-trigger:hover {
      color: #fcd34d;
    }

    .edit-row {
      background-color: var(--bg-input);
    }

    .edit-form-card {
      padding: 14px 16px;
      border-left: 3px solid var(--accent-cyan);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .edit-form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 900px) {
      .edit-form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .edit-form-grid {
        grid-template-columns: 1fr;
      }
    }

    .edit-field-full {
      grid-column: 1 / -1;
    }

    .edit-textarea {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      padding: 8px 10px;
      resize: vertical;
      min-height: 56px;
    }

    .edit-textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .edit-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px solid var(--border-subtle);
    }

    /* ==========================================================================
       MOBILE RESPONSIVE TABLE (<= 768px)
       ========================================================================== */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .hud-header {
        padding: 12px 14px;
      }

      .hud-title {
        font-size: 1.15rem;
      }

      .col-desktop-only {
        display: none;
      }

      .col-filter-input {
        display: none;
      }

      .th-sort {
        padding-bottom: 0;
      }

      th, td {
        padding: 10px 9px;
      }

      tbody tr.data-row {
        cursor: pointer;
      }

      tbody tr.data-row.expanded {
        background-color: var(--bg-hover);
        border-bottom-color: transparent;
      }

      .mobile-chevron {
        display: inline-block;
      }

      tbody tr.detail-row.open {
        display: table-row;
      }
    }

    tbody tr:hover {
      background-color: var(--bg-hover);
    }

    td {
      padding: 11px 12px;
      vertical-align: top;
      color: var(--text-primary);
    }

    .wanzer-name {
      font-weight: 700;
      color: var(--accent-amber);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .skill-name {
      font-weight: 700;
      color: #f8fafc;
      font-size: 0.91rem;
      white-space: nowrap;
    }

    /* Part Badges */
    .badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .badge-body {
      background: var(--accent-cyan-dim);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .badge-arms {
      background: var(--accent-rose-dim);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .badge-legs {
      background: var(--accent-emerald-dim);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    /* Slots Pill */
    .slot-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 24px;
      padding: 0 8px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .slot-1 { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35); }
    .slot-2 { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .slot-3 { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .slot-4 { background: rgba(168, 85, 247, 0.18); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4); }
    .slot-5 { background: rgba(244, 63, 94, 0.18); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.4); }

    .condition-tag {
      display: inline-block;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.76rem;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .desc-text {
      color: #e2e8f0;
      min-width: 230px;
      max-width: 360px;
    }

    .notes-cell {
      color: var(--text-secondary);
      font-size: 0.81rem;
      min-width: 210px;
      max-width: 340px;
    }

    .notes-cell ul {
      margin: 0;
      padding-left: 16px;
    }

    .notes-cell li {
      margin-bottom: 2px;
    }

    .notes-empty {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    /* ==========================================================================
       5. PAGINATION FOOTER & TOAST NOTIFICATION
       ========================================================================== */
    .table-footer {
      background: var(--bg-panel-alt);
      border-top: 1px solid var(--border-subtle);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .page-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 5px 10px;
      cursor: pointer;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .page-btn.active {
      background: var(--accent-cyan);
      color: #091017;
      border-color: var(--accent-cyan);
      font-weight: 700;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #132232;
      border: 1px solid var(--accent-emerald);
      color: #ecfdf5;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- TACTICAL HEADER -->
    <header class="hud-header">
      <h1 class="hud-title">Front Mission 3 — Battle Skills</h1>
    </header>

    <!-- CONTROLS & MULTI-FILTER PANEL -->
    <section class="controls-panel" id="controlsPanel" aria-label="Search and Filters">
      <div class="controls-header">
        <div class="controls-header-title">
          <span>Search &amp; Filters</span>
          <span class="active-filter-badge" id="activeFilterBadge">0 Active</span>
        </div>
        <button type="button" class="btn" id="toggleFiltersBtn" aria-expanded="true" aria-controls="controlsBody">
          Hide Filters ▲
        </button>
      </div>

      <div class="controls-body" id="controlsBody">
        <div class="controls-top">
          <div class="control-group">
            <label class="control-label" for="globalSearch">Global Instant Search</label>
            <input
              type="text"
              id="globalSearch"
              class="input-field"
              placeholder="Search Wanzer, Skill, Description, Condition, or Notes..."
            />
          </div>

          <div class="control-group">
            <label class="control-label" for="wanzerFilter">Wanzer</label>
            <select id="wanzerFilter" class="select-field">
              <option value="ALL">All Wanzers (32)</option>
            </select>
          </div>

          <div class="control-group">
            <label class="control-label" for="partFilter">Part</label>
            <select id="partFilter" class="select-field">
              <option value="ALL">All Parts</option>
              <option value="Body">Body</option>
              <option value="Arms">Arms</option>
              <option value="Legs">Legs</option>
            </select>
          </div>

          <div class="control-group">
            <label class="control-label" for="conditionFilter">Condition</label>
            <select id="conditionFilter" class="select-field">
              <option value="ALL">All Conditions</option>
            </select>
          </div>

          <div class="control-group">
            <label class="control-label" for="slotsFilter">Computer Slots</label>
            <select id="slotsFilter" class="select-field">
              <option value="ALL">Any Slots (1–5)</option>
              <option value="1">1 Slot</option>
              <option value="2">2 Slots</option>
              <option value="3">3 Slots</option>
              <option value="4">4 Slots</option>

    const STORAGE_KEY = "fm3_battle_skills_custom_v1";

    function loadInitialSkills() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return { data: parsed, isCustom: true };
          }
        }
      } catch (err) {
        console.warn("Could not read saved CSV data from localStorage:", err);
      }
      return { data: DEFAULT_FM3_SKILLS.map((item) => ({ ...item, notes: [...item.notes] })), isCustom: false };
    }

    let FM3_SKILLS = initialLoad.data;

    /* ==========================================================================
       FILTERING & SORTING ENGINE
       ========================================================================== */
    const PART_ORDER = { Body: 1, Arms: 2, Legs: 3 };

    function getFilteredAndSortedData() {
      const globalTerm = state.search.trim().toLowerCase();

      const filtered = FM3_SKILLS.filter((item) => {
        if (state.wanzer !== "ALL" && item.wanzer !== state.wanzer) return false;
        if (state.part !== "ALL" && item.part !== state.part) return false;
        if (state.condition !== "ALL" && item.condition !== state.condition) return false;
        if (state.slots !== "ALL" && String(item.slots) !== state.slots) return false;

        // Per-column filters
        if (state.colFilters.wanzer && !item.wanzer.toLowerCase().includes(state.colFilters.wanzer)) return false;
        if (state.colFilters.part && !item.part.toLowerCase().includes(state.colFilters.part)) return false;
        if (state.colFilters.skill && !item.skill.toLowerCase().includes(state.colFilters.skill)) return false;
        if (state.colFilters.description && !item.description.toLowerCase().includes(state.colFilters.description)) return false;
        if (state.colFilters.condition && !item.condition.toLowerCase().includes(state.colFilters.condition)) return false;
        if (state.colFilters.slots && !String(item.slots).includes(state.colFilters.slots)) return false;
        if (state.colFilters.notes) {
          const notesJoined = item.notes.join(" ").toLowerCase();
          if (!notesJoined.includes(state.colFilters.notes)) return false;
        }

        // Global search
        if (globalTerm) {
          const searchable = [
            item.wanzer,
            item.part,
            item.skill,
            item.description,
            item.condition,
            String(item.slots),
            item.notes.join(" ")
          ].join(" ").toLowerCase();
          if (!searchable.includes(globalTerm)) return false;
        }

        return true;
      });

      // Sort
      filtered.sort((a, b) => {
        if (state.sortCol === "wanzer") {
          const cmp = a.wanzer.localeCompare(b.wanzer);
          if (cmp !== 0) return state.sortDir === "asc" ? cmp : -cmp;
          // Secondary sort by Body -> Arms -> Legs
          return (PART_ORDER[a.part] || 9) - (PART_ORDER[b.part] || 9);
        }

        if (state.sortCol === "part") {
          const diff = (PART_ORDER[a.part] || 9) - (PART_ORDER[b.part] || 9);
          if (diff !== 0) return state.sortDir === "asc" ? diff : -diff;
          return a.wanzer.localeCompare(b.wanzer);
        }

        if (state.sortCol === "slots") {
          const diff = a.slots - b.slots;
          if (diff !== 0) return state.sortDir === "asc" ? diff : -diff;
          return a.wanzer.localeCompare(b.wanzer);
        }

        const valA = state.sortCol === "notes" ? a.notes.join(" ") : String(a[state.sortCol] || "");
        const valB = state.sortCol === "notes" ? b.notes.join(" ") : String(b[state.sortCol] || "");
        const cmp = valA.localeCompare(valB);
        if (cmp !== 0) return state.sortDir === "asc" ? cmp : -cmp;
        return a.wanzer.localeCompare(b.wanzer);
      });

      return filtered;
    }

    /* ==========================================================================

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getPartBadgeClass(part) {
      if (part === "Body") return "badge-body";
      if (part === "Arms") return "badge-arms";
      return "badge-legs";
    }

    function formatNotesHtml(notes) {
      if (!notes || notes.length === 0) {
        return `<span class="notes-empty">—</span>`;
      }
      if (notes.length === 1) {
        return escapeHtml(notes[0]);
      }
      return `<ul>${notes.map((n) => `<li>${escapeHtml(n)}</li>`).join("")}</ul>`;
    }

    function updateActiveFilterBadge() {
      let count = 0;

      if (state.condition !== "ALL") count++;
      if (state.slots !== "ALL") count++;
      Object.values(state.colFilters).forEach((val) => {
        if (val) count++;
      });

      if (count > 0) {
        dom.activeFilterBadge.textContent = `${count} Active`;
        dom.activeFilterBadge.classList.add("visible");
      } else {
        dom.activeFilterBadge.classList.remove("visible");

    /* ==========================================================================
       CSV EXPORT (WORKS 100% OFFLINE VIA BLOB URL)
       ========================================================================== */
    function exportFilteredCsv() {
      const rows = getFilteredAndSortedData();
      const headers = ["Wanzer", "Part", "Skill", "Description", "Condition", "Computer slots", "Notes"];
      const csvLines = [headers.join(",")];

      rows.forEach((r) => {
        const line = [
          r.wanzer,
          r.part,
          r.skill,
          r.description,
          r.condition,
          r.slots,
          r.notes.join(" | ")
        ].map((val) => `"${String(val).replace(/"/g, '""')}"`);
        csvLines.push(line.join(","));
      });

      const blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "fm3_battle_skills.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast(`Exported ${rows.length} rows to CSV`);
    }

    /* ==========================================================================
       CSV IMPORT & RFC-4180 PARSER (WORKS 100% OFFLINE + SAVES TO LOCALSTORAGE)
       ========================================================================== */
    function parseCsvRows(text) {
      const rows = [];
      let currentRow = [];
      let currentField = "";
      let inQuotes = false;

      // Strip UTF-8 BOM if present
      const cleanText = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < cleanText.length; i++) {
        const char = cleanText[i];
        const nextChar = cleanText[i + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ",") {
            currentRow.push(currentField);
            currentField = "";
          } else if (char === "\r" && nextChar === "\n") {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = "";
            i++;
          } else if (char === "\n" || char === "\r") {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = "";
          } else {
            currentField += char;
          }
        }
      }

      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField);
        rows.push(currentRow);
      }

      return rows.filter((r) => r.some((cell) => cell.trim() !== ""));
    }

    function handleCsvImport(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsedRows = parseCsvRows(String(event.target.result || ""));
          if (parsedRows.length < 2) {
            showToast("CSV file is empty or missing data rows");
            return;
          }

          const headers = parsedRows[0].map((h) => h.trim().toLowerCase());
          const idxWanzer = headers.indexOf("wanzer");
          const idxPart = headers.indexOf("part");
          const idxSkill = headers.indexOf("skill");
          const idxDesc = headers.indexOf("description");
          const idxCond = headers.indexOf("condition");
          const idxSlots = headers.findIndex((h) => h.includes("slot"));
          const idxNotes = headers.indexOf("notes");

          if (idxWanzer === -1 || idxPart === -1 || idxSkill === -1) {
            showToast("Invalid CSV: requires Wanzer, Part, and Skill columns");
            return;
          }

          const importedSkills = [];
          for (let i = 1; i < parsedRows.length; i++) {
            const cols = parsedRows[i];
            const wanzer = (cols[idxWanzer] || "").trim();
            const part = (cols[idxPart] || "").trim();
            const skill = (cols[idxSkill] || "").trim();
            if (!wanzer && !skill) continue;

            const description = idxDesc !== -1 ? (cols[idxDesc] || "").trim() : "";
            const condition = idxCond !== -1 ? (cols[idxCond] || "").trim() : "";
            const rawSlots = idxSlots !== -1 ? parseInt(cols[idxSlots], 10) : 1;
            const slots = Number.isFinite(rawSlots) && rawSlots >= 1 && rawSlots <= 5 ? rawSlots : 1;
            const rawNotes = idxNotes !== -1 ? (cols[idxNotes] || "").trim() : "";
            const notes = rawNotes
              ? rawNotes.split("|").map((n) => n.trim()).filter(Boolean)
              : [];

            importedSkills.push({
              wanzer: wanzer || "Unknown",
              part: part || "Body",
              skill: skill || "Unnamed Skill",
              description,
              condition,
              slots,
              notes
            });
          }

          if (importedSkills.length === 0) {
            showToast("No valid skill rows found in CSV");
            return;
          }

          FM3_SKILLS = importedSkills;
          assignSkillIds();
          isCustomDataset = true;
          saveSkillsToStorage();

          state.wanzer = "ALL";
          state.condition = "ALL";
          state.currentPage = 1;
          state.expandedRows.clear();
          state.editingId = null;
          populateDropdowns();
          render();
          showToast(`Imported ${importedSkills.length} rows from CSV`);
        } catch (err) {
          console.error("CSV import error:", err);
          showToast("Failed to parse CSV file");
        }
      };
      reader.readAsText(file);
    }

    function saveSkillsToStorage() {
      try {
        const cleanData = FM3_SKILLS.map(({ _id, ...rest }) => rest);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanData));
      } catch (storageErr) {
        console.warn("Could not save data to localStorage:", storageErr);
      }
    }

    function setEditMode(enabled) {
      state.editMode = enabled;
      if (!enabled) {
        state.editingId = null;
      }
      document.body.classList.toggle("edit-mode-enabled", enabled);
      dom.viewModeBtn.classList.toggle("active", !enabled);
      dom.editModeBtn.classList.toggle("active", enabled);
      dom.editModeBtn.classList.toggle("edit-active", enabled);
      dom.editModeHint.style.display = enabled ? "inline" : "none";
      render();
    }

    function restoreDefaultSkills() {
      FM3_SKILLS = DEFAULT_FM3_SKILLS.map((item) => ({ ...item, notes: [...item.notes] }));
      assignSkillIds();
      isCustomDataset = false;
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        console.warn("Could not clear localStorage:", err);
      }
      state.wanzer = "ALL";
      state.condition = "ALL";
      state.currentPage = 1;
      state.expandedRows.clear();
      state.editingId = null;
      populateDropdowns();
      render();
      showToast("Restored original 96 skills");
    }

    /* ==========================================================================
       EVENT LISTENERS
       ========================================================================== */
    dom.toggleFiltersBtn.addEventListener("click", () => {
      state.filtersCollapsed = !state.filtersCollapsed;
      dom.controlsPanel.classList.toggle("collapsed", state.filtersCollapsed);
      dom.toggleFiltersBtn.setAttribute("aria-expanded", String(!state.filtersCollapsed));
      dom.toggleFiltersBtn.textContent = state.filtersCollapsed ? "Show Filters ▼" : "Hide Filters ▲";
    });

    dom.viewModeBtn.addEventListener("click", () => setEditMode(false));
    dom.editModeBtn.addEventListener("click", () => setEditMode(true));

    dom.tableBody.addEventListener("click", (e) => {
      // Cancel button inside inline edit form
      if (e.target.closest(".cancel-edit-btn")) {
        state.editingId = null;
        render();
        return;
      }

      // When in Edit Mode, clicking the skill name toggles its inline edit form
      if (state.editMode) {
        const skillTrigger = e.target.closest(".skill-name-trigger");
        if (skillTrigger) {
          const editId = skillTrigger.getAttribute("data-edit-id");
          state.editingId = state.editingId === editId ? null : editId;
          render();
          return;
        }
      }

      // Expand/collapse detail row on mobile viewports (<= 768px)
      if (window.innerWidth > 768) return;
      if (e.target.closest(".edit-row")) return;
      const dataRow = e.target.closest("tr.data-row");
      if (!dataRow) return;
      const rowKey = dataRow.getAttribute("data-row-key");
      if (!rowKey) return;

      if (state.expandedRows.has(rowKey)) {
        state.expandedRows.delete(rowKey);
      } else {
        state.expandedRows.add(rowKey);
      }
      render();
    });

    dom.tableBody.addEventListener("submit", (e) => {
      const form = e.target.closest(".edit-form-card");
      if (!form) return;
      e.preventDefault();

      const formId = form.getAttribute("data-form-id");
      const targetIndex = FM3_SKILLS.findIndex((item) => item._id === formId);
      if (targetIndex === -1) return;

      const formData = new FormData(form);
      const updatedWanzer = String(formData.get("wanzer") || "").trim() || FM3_SKILLS[targetIndex].wanzer;
      const updatedPart = String(formData.get("part") || "Body").trim();
      const updatedSkill = String(formData.get("skill") || "").trim() || FM3_SKILLS[targetIndex].skill;
      const updatedSlots = parseInt(String(formData.get("slots") || "1"), 10) || 1;
      const updatedCondition = String(formData.get("condition") || "").trim();
      const updatedDescription = String(formData.get("description") || "").trim();
      const rawNotes = String(formData.get("notes") || "");
      const updatedNotes = rawNotes
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
      const shouldExport = formData.get("exportAfterSave") === "on";

      FM3_SKILLS[targetIndex] = {
        ...FM3_SKILLS[targetIndex],
        wanzer: updatedWanzer,
        part: updatedPart,
        skill: updatedSkill,
        slots: updatedSlots,
        condition: updatedCondition,
        description: updatedDescription,
        notes: updatedNotes
      };

      isCustomDataset = true;
      saveSkillsToStorage();
      state.editingId = null;

      // Preserve active dropdown selections if still valid
      const prevWanzer = state.wanzer;
      const prevCondition = state.condition;
      populateDropdowns();
      if ([...dom.wanzerFilter.options].some((o) => o.value === prevWanzer)) {
        dom.wanzerFilter.value = prevWanzer;
      } else {
        state.wanzer = "ALL";
      }
      if ([...dom.conditionFilter.options].some((o) => o.value === prevCondition)) {
        dom.conditionFilter.value = prevCondition;
      } else {
        state.condition = "ALL";
      }

      render();

      if (shouldExport) {
        exportFilteredCsv();
      } else {
        showToast(`Saved "${updatedSkill}" to browser storage`);
      }
    });

    dom.globalSearch.addEventListener("input", (e) => {
      state.search = e.target.value;
      state.currentPage = 1;
      render();
    });

    dom.wanzerFilter.addEventListener("change", (e) => {
      state.wanzer = e.target.value;
      state.currentPage = 1;
      render();
    });

    dom.partFilter.addEventListener("change", (e) => {
      state.part = e.target.value;
      state.currentPage = 1;
      syncQuickPills();
      render();
    });

    dom.conditionFilter.addEventListener("change", (e) => {
      state.condition = e.target.value;
      state.currentPage = 1;
      render();
    });

    dom.slotsFilter.addEventListener("change", (e) => {
      state.slots = e.target.value;
      state.currentPage = 1;
      syncQuickPills();
      render();
    });

    dom.partPills.addEventListener("click", (e) => {
      const btn = e.target.closest(".pill");
      if (!btn) return;
      state.part = btn.getAttribute("data-part");
      dom.partFilter.value = state.part;
      state.currentPage = 1;
      syncQuickPills();
      render();
    });

    dom.slotPills.addEventListener("click", (e) => {
      const btn = e.target.closest(".pill");
      if (!btn) return;
      state.slots = btn.getAttribute("data-slot");
      dom.slotsFilter.value = state.slots;
      state.currentPage = 1;
      syncQuickPills();
      render();
    });

    document.querySelectorAll(".col-filter-input").forEach((input) => {
      input.addEventListener("input", (e) => {
        const key = e.target.getAttribute("data-filter");
        state.colFilters[key] = e.target.value.trim().toLowerCase();
        state.currentPage = 1;
        render();
      });
      input.addEventListener("click", (e) => e.stopPropagation());
    });

    document.querySelectorAll("#skillsTable thead .th-sort").forEach((sortHeader) => {
      sortHeader.addEventListener("click", () => {
        const th = sortHeader.closest("th");
        const col = th.getAttribute("data-col");
        if (state.sortCol === col) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortCol = col;
          state.sortDir = "asc";
        }
        render();
      });
    });

    dom.paginationControls.addEventListener("click", (e) => {
      const btn = e.target.closest(".page-btn");
      if (!btn || btn.disabled) return;
      state.currentPage = Number(btn.getAttribute("data-page"));
      render();
    });

    dom.pageSizeSelect.addEventListener("change", (e) => {
      state.pageSize = Number(e.target.value);
      state.currentPage = 1;
      render();
    });

    dom.resetFiltersBtn.addEventListener("click", () => {
      state.search = "";
      state.wanzer = "ALL";
      state.part = "ALL";
      state.condition = "ALL";
      state.slots = "ALL";
      state.colFilters = {
        wanzer: "",
        part: "",
        skill: "",
        description: "",
        condition: "",
        slots: "",
        notes: ""
      };
      state.sortCol = "wanzer";
      state.sortDir = "asc";
      state.currentPage = 1;
      state.expandedRows.clear();

      dom.globalSearch.value = "";
      dom.wanzerFilter.value = "ALL";
      dom.partFilter.value = "ALL";
      dom.conditionFilter.value = "ALL";
      dom.slotsFilter.value = "ALL";
      document.querySelectorAll(".col-filter-input").forEach((inp) => (inp.value = ""));
      syncQuickPills();
      render();
      showToast("All filters reset");
    });

    dom.importCsvBtn.addEventListener("click", () => {
      dom.importCsvInput.value = "";
      dom.importCsvInput.click();
    });

    dom.importCsvInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      handleCsvImport(file);
    });

    dom.restoreDefaultBtn.addEventListener("click", restoreDefaultSkills);

    dom.exportCsvBtn.addEventListener("click", exportFilteredCsv);

    // Boot
    populateDropdowns();
    render();
  </script>
</body>
</html>
